<body>
<header class="site">
    <div class="inner">
        <a href="/handball-apps-site/"><img class="header-icon" src="/handball-apps-site/handball-recorder/images/icon-32.png" alt="" width="24" height="24">handball apps</a>
        <nav>
            <a href="/handball-apps-site/handball-recorder/">ハンド記録</a>
        </nav>
    </div>
</header>
<main>
    <h1>試合データデモ</h1>
    <p class="demo-lede">ハンドボールの公開試合データを選ぶと、スコア・スタッツ・得点タイムラインをその場で集計して表示します。</p>

    <div class="demo-note">
        この画面は<strong>サーバーを使っていません</strong>。<a href="https://github.com/kinjo-ryura/handball-sample-matches">公開されている試合データ（JSON）</a>を取得し、記録アプリ「ハンド記録」と<strong>同じ集計コア</strong>を WebAssembly でブラウザ内実行して計算しています。
        <span class="version" id="toolkit-version"></span>
    </div>

    <div class="demo-controls">
        <label for="match-select">試合を選ぶ</label>
        <select id="match-select" disabled>
            <option>読み込み中…</option>
        </select>
    </div>

    <div class="demo-status" id="demo-status">読み込み中…</div>
    <div id="demo-result"></div>

    <p class="demo-cta">
        <a class="app-store" href="/handball-apps-site/handball-recorder/">アプリ「ハンド記録」を見る</a>
    </p>
</main>
