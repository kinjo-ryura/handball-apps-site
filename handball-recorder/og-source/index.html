<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OG source — ハンド記録</title>
<link rel="stylesheet" href="../../style.css">
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
    }
    body {
        position: relative;
    }
    .og-card {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: 30px 30px;
        display: flex;
        align-items: center;
        gap: 50px;
        background: radial-gradient(ellipse at 25% 40%, #A54DB6 0%, #8C2AA6 35%, #570D6C 100%);
        color: #ffffff;
    }
    .og-left {
        flex: 0 0 390px;
        text-align: center;
    }
    /* 220px で描くので元画像は 512 を使う。180 だと拡大されてぼける。 */
    .og-left .app-icon {
        display: block;
        width: 220px;
        height: 220px;
        margin: 0 auto 24px;
        /* Icon Composer が角丸を焼き込むため丸めない。
           光は box-shadow だと要素の矩形（四角）に付き、透過の角の外側まで光って
           四角く見える。drop-shadow はアルファに沿うので角丸のまま光る。
           drop-shadow には spread が無いため、近い輪郭と広い暈しの 2 段で重ねる。 */
        filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.45))
                drop-shadow(0 0 70px rgba(255, 255, 255, 0.35));
    }
    .og-left h1 {
        font-size: 3.4rem;
        margin: 0 0 12px;
        color: #ffffff;
    }
    .og-left .tagline {
        font-size: 1.6rem;
        font-weight: 700;
        color: #ffffff;
        margin: 0;
    }
    .og-right {
        flex: 1;
    }
    .og-right h2 {
        font-size: 2.8rem;
        margin: 0 0 24px;
        color: #ffffff;
    }
    .og-right ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .og-right li {
        font-size: 2rem;
        padding: 16px 0 16px 28px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        position: relative;
        color: #ffffff;
    }
    .og-right li::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ffffff;
        transform: translateY(-50%);
    }
    .og-right li:last-child {
        border-bottom: none;
    }
    .og-right .hl {
        color: #FFB55C;
        font-weight: 700;
    }
</style>
</head>
<body>
    <div class="og-card">
        <div class="og-left">
            <img class="app-icon" src="../images/icon-512.png" alt="ハンド記録 アプリアイコン">
            <h1>ハンド記録</h1>
            <p class="tagline">ハンドボールを記録で振り返ろう</p>
        </div>
        <div class="og-right">
            <h2>こんな人に</h2>
            <ul>
                <li><strong class="hl">自分の試合</strong>を、スタッツと動画で振り返りたい</li>
                <li>撮った<strong class="hl">試合動画</strong>から、ハイライトを作りたい</li>
                <li><strong class="hl">スタッツ</strong>を、チームや仲間に共有したい</li>
                <li><strong class="hl">推し</strong>選手の活躍を、まとめて見たい</li>
            </ul>
        </div>
    </div>
</body>
</html>
