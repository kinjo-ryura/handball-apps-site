<body>
<header class="site">
    <div class="inner">
        <a href="./"><img class="header-icon" src="images/icon-32.png" alt="" width="24" height="24"><span class="wordmark">h++</span></a>
    </div>
</header>
<main>
    <h1>ハンドプラス</h1>
    <p>ハンドボール関連アプリの公式ページです。</p>

    <ul class="app-list">
        <li>
            <!-- アイコンも名前と同じ LP への入口にする（押せる領域を広げるため）。行き先が
                 名前のリンクと重複するので、スクリーンリーダーとキーボードには出さない
                 （読み上げとタブ移動が二重になる）。マウス / タッチ専用のリンク。 -->
            <a class="app-list-icon-link" href="handball-recorder/" aria-hidden="true" tabindex="-1"><img class="app-list-icon" src="handball-recorder/images/icon-180.png" alt="" width="64" height="64"></a>
            <div class="app-list-body">
                <a href="handball-recorder/">ハンド記録（HandballRecorder）</a>
                <p>試合中の記録から、試合後のサマリ・スタッツまで。</p>
                <!-- 傘のトップから LP を経由せずインストール / デモへ行けるようにする。
                     プロフィールの Website 欄がこのページを指しているため（親リポ #234）。 -->
                <div class="app-list-cta">
                    <a class="app-store" href="https://apps.apple.com/jp/app/id6762165079">App Store</a>
                    <a class="app-store secondary" href="handball-recorder/demo/">アプリなしで試す</a>
                </div>
                <div class="links">
                    <a href="handball-recorder/privacy/">プライバシーポリシー</a>
                    <a href="handball-recorder/support/">サポート</a>
                </div>
            </div>
        </li>
        <!-- 「開発中」は状態だけを示す表記で、時期は含意しない。まだ配布物が無いので
             名前はリンクにしない。表記を変える条件は親リポ handball-project の
             docs/lean/visions/placeobjectdemo.md「対外的には『開発中』と名乗る」。 -->
        <li>
            <img class="app-list-icon" src="images/shot-analysis-icon.png" alt="" width="64" height="64">
            <div class="app-list-body">
                <span class="app-list-name">フォーム改善アプリ <span class="wip">開発中</span></span>
                <p>iPhone だけで、AR でシュートフォームを分析する。</p>
            </div>
        </li>
    </ul>
</main>
<footer class="site">
    &copy; ハンドプラス
</footer>

     送信前に落とす（`cleanLocation`）。**その代償として `?list` のようなクエリは区別できない**
     ので、一覧は `demo/list/` の実パスに移してある。 -->
