<?xml version="1.0" encoding="UTF-8"?>
<!--
  ハンドプラスのブランドマーク。
  実際のハンドボール（切頂二十面体）の面構成 — 中央の正五角形を、その 5 辺に接する
  5 枚の正六角形が囲む。中央の五角形は面として描かず、空白として残す。

  確定した仕様（#211 で 3 方式 x 回転 7 x 押し込み量 6 を比較して選択）:
  - 回転 36 度。**左右対称になるのは 0 度と 36 度だけ**（五角形は 5 回対称なので
    36 度で見え方が一巡する）。36 度は上に 1 枚・左右に 2 枚ずつの配置。
  - 隙間は「全辺を法線方向に押し込む」方式で d=10（1024 基準）。重心方向への一様縮小
    だと角のほうが隙間が広くなるが、この方式は**全周で幅が一定**になる。
  - 角丸なし。角を立てたほうが六角形の形が明確に出る。
  - 押し込んだぶん外形が縮むので、余白 16 に収まるよう再スケールしてある。

  **隙間は必須**。正しい幾何では隣接面が辺を完全に共有するため、隙間が無いと同色で
  塗ったとき境界が消えて 1 つの塊になる。

  平面では五角形 108 度 + 六角形 120 度 x2 = 348 度で 12 度足りない。この不足角が
  ボールを球に曲げている理由で、開いた図では五角形の角の切れ込みとして残る。

  色は currentColor。書き出しは scripts/generate-brand-icon.sh。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g fill="currentColor">
    <path d="M 396.1,372.2 L 336.0,557.0 L 146.0,597.4 L 16.0,453.0 L 76.0,268.2 L 266.1,227.8 Z"/>
    <path d="M 343.2,579.0 L 500.4,693.2 L 480.1,886.5 L 302.6,965.5 L 145.4,851.3 L 165.7,658.1 Z"/>
    <path d="M 523.6,693.2 L 680.8,579.0 L 858.3,658.1 L 878.6,851.3 L 721.4,965.5 L 543.9,886.5 Z"/>
    <path d="M 688.0,557.0 L 627.9,372.2 L 757.9,227.8 L 948.0,268.2 L 1008.0,453.0 L 878.0,597.4 Z"/>
    <path d="M 609.1,358.5 L 414.9,358.5 L 317.7,190.3 L 414.9,22.0 L 609.1,22.0 L 706.3,190.3 Z"/>
  </g>
</svg>
